name: Bug report
description: Report a reproducible problem in Ninfa Cortes.
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the smallest example you can share publicly.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ninfa Cortes and Windows versions
      placeholder: 0.0.1, Windows 11
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove account information and local file paths before sharing.
